name: GenAIOps - skill support-policy

on:
  pull_request:
    paths: ["skills/**", "evals/**"]
  push:
    branches: [main]
    paths: ["skills/**"]

permissions:
  id-token: write
  contents: read

env:
  SKILL: support-policy
  FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
  MODEL_DEPLOYMENT: ${{ vars.JUDGE_MODEL_DEPLOYMENT }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/validate_skill.py

  stage-and-evaluate:
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.publish.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: pip install azure-ai-projects azure-identity
      - id: publish
        run: echo "version=$(python scripts/foundry_skills.py publish $SKILL | tail -1)" >> "$GITHUB_OUTPUT"
      - id: stage
        run: echo "agent=$(python scripts/foundry_skills.py stage $SKILL ${{ steps.publish.outputs.version }} | tail -1)" >> "$GITHUB_OUTPUT"
      - id: prod
        run: echo "agent=$(python scripts/foundry_skills.py current support-agent | tail -1)" >> "$GITHUB_OUTPUT"
      - uses: microsoft/ai-agent-evals@v3-beta
        with:
          azure-ai-project-endpoint: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          deployment-name: ${{ vars.JUDGE_MODEL_DEPLOYMENT }}
          agent-ids: "${{ steps.stage.outputs.agent }},${{ steps.prod.outputs.agent }}"
          baseline-agent-id: ${{ steps.prod.outputs.agent }}
          data-path: ${{ github.workspace }}/evals/support-policy.json

  promote:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: stage-and-evaluate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: pip install azure-ai-projects azure-identity
      - run: python scripts/foundry_skills.py promote $SKILL ${{ needs.stage-and-evaluate.outputs.version }}
